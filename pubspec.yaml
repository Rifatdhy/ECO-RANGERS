name: eco_rangers
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.1.2
  geolocator: ^14.0.0
  sqflite: ^2.3.3
  path: ^1.9.1
  device_preview: ^1.3.1
  http: ^1.5.0
  get_it: ^7.7.0
  intl: ^0.20.2
  url_launcher: ^6.3.0
  flutter_dotenv: ^5.1.0
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  collection: ^1.18.0
  photo_view: ^0.15.0 # Ditambahkan untuk pratinjau gambar

  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: Logo.jpg
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: Logo.jpg
  min_sdk_android: 21

  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
