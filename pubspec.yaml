name: eco_rangers
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.1.2
  geolocator: ^14.0.0
  device_preview: ^1.3.1
  http: ^1.5.0
  get_it: ^7.7.0
  intl: ^0.20.2
  url_launcher: ^6.3.0
  flutter_dotenv: ^5.1.0
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.2
  image: ^4.3.0
  photo_view: ^0.15.0 # Ditambahkan untuk pratinjau gambar

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

dependency_overrides:
  uuid: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: Logo.jpg
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: Logo.jpg
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
