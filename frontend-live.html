<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eco Rangers — Apple Luxury Civic UI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --canvas:#F9FAF9;--canvas-sub:#F0F3F1;--surface:#FFFFFF;
  --ink:#111815;--ink-sub:#55605B;--ink-muted:#88958F;--line:#E4E9E6;
  --forest:#0F2B1D;--emerald:#1B4D36;--sage:#437A60;--mint:#E8F3ED;
  --pending-bg:#FFFBEB;--pending-border:#FDE68A;--pending-text:#92400E;
  --diproses-bg:#EFF6FF;--diproses-border:#BFDBFE;--diproses-text:#1E40AF;
  --selesai-bg:#ECFDF5;--selesai-border:#A7F3D0;--selesai-text:#065F46;
  --ditolak-bg:#FEF2F2;--ditolak-border:#FECACA;--ditolak-text:#991B1B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--canvas);color:var(--ink);line-height:1.5}
.topbar{position:sticky;top:10px;z-index:40;display:flex;gap:10px;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:999px;padding:8px 16px;max-width:1400px;margin:0 auto}
.badge{display:inline-flex;gap:5px;align-items:center;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge.pending{background:var(--pending-bg);color:var(--pending-text)}
.badge.diproses{background:var(--diproses-bg);color:var(--diproses-text)}
.badge.selesai{background:var(--selesai-bg);color:var(--selesai-text)}
.badge.ditolak{background:var(--ditolak-bg);color:var(--ditolak-text)}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-btn{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;cursor:pointer}
.pill-btn.primary{background:var(--forest);color:#fff;border-color:var(--forest)}
.btn-lux{width:100%;padding:12px;border-radius:14px;border:none;background:var(--forest);color:#fff;font-weight:700;cursor:pointer}
.lux-input{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:13px}
.phone-viewport{width:390px;max-width:100%;margin:20px auto;background:#fff;border:1px solid var(--line);border-radius:36px;padding:10px;box-shadow:0 20px 48px rgba(15,43,29,0.08)}
.phone-screen{border-radius:26px;overflow:hidden;border:1px solid var(--line);background:var(--canvas);min-height:700px;display:flex;flex-direction:column}
.ios-header{padding:16px 18px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.phone-content{padding:14px;flex:1;overflow-y:auto;padding-bottom:80px}
.feed-card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px;cursor:pointer;padding:14px}
.ios-bottom-nav{height:64px;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center}
.nav-tab{display:flex;flex-direction:column;align-items:center;cursor:pointer;font-size:10px;font-weight:700;color:var(--ink-muted)}
.nav-tab.active{color:var(--forest)}
.map-view{height:300px;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:10px}
</style>
</head>
<body>
<div style="max-width:1440px;margin:0 auto;padding:14px">
  <div class="topbar">
    <div style="font-weight:800;display:flex;align-items:center;gap:8px"><span style="width:26px;height:26px;border-radius:8px;background:var(--forest);color:#fff;display:grid;place-items:center">🌱</span> ECO RANGERS</div>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="apiBase" class="lux-input" style="width:220px;padding:6px 12px;border-radius:999px" placeholder="http://127.0.0.1:8000">
      <button class="pill-btn primary" id="btnTestApi">Hubungkan API</button>
      <span id="pingBadge" class="badge pending"><span class="badge-dot"></span> Offline</span>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:340px 1fr;gap:20px;margin-top:20px">
    <div style="background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;height:fit-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <b style="font-size:13px">Autentikasi</b>
        <span class="badge" id="roleTag">Tamu</span>
      </div>
      <form id="loginForm" style="display:grid;gap:8px">
        <input class="lux-input" name="email" type="email" placeholder="Email" required value="admin@gmail.com">
        <input class="lux-input" name="password" type="password" placeholder="Kata sandi" required value="12345678">
        <button class="btn-lux" type="submit">Masuk</button>
      </form>
    </div>

    <div class="phone-viewport">
      <div class="phone-screen">
        <div class="ios-header">
          <h2 id="viewHeading" style="font-size:20px;font-weight:800">Beranda</h2>
          <div style="display:flex;gap:6px">
            <button class="pill-btn" data-nav="home">Home</button>
            <button class="pill-btn" data-nav="map">Peta</button>
            <button class="pill-btn" data-nav="create">Lapor</button>
            <button class="pill-btn" data-nav="reports">Feed</button>
          </div>
        </div>

        <div class="phone-content" id="screenBody"></div>

        <div class="ios-bottom-nav">
          <div class="nav-tab active" data-nav="home">🏠<span>Beranda</span></div>
          <div class="nav-tab" data-nav="map">🗺️<span>Peta</span></div>
          <div class="nav-tab" data-nav="create">➕<span>Lapor</span></div>
          <div class="nav-tab" data-nav="reports">📋<span>Aktivitas</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

const state = {
  apiBase: localStorage.getItem('eco_api_base') || 'http://127.0.0.1:8000',
  token: localStorage.getItem('eco_token') || '',
  user: JSON.parse(localStorage.getItem('eco_user') || 'null'),
  view: 'home',
  reports: [],
  stats: null
};

$('#apiBase').value = state.apiBase;
$('#apiBase').onchange = e => { state.apiBase = e.target.value.trim().replace(/\/$/, ''); localStorage.setItem('eco_api_base', state.apiBase); };

const api = async (path, opts = {}) => {
  const url = path.startsWith('http') ? path : state.apiBase + path;
  const headers = { 'Accept': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  return fetch(url, { ...opts, headers });
};

async function ping() {
  try {
    const res = await fetch(state.apiBase + '/api/ping');
    const ok = res.ok;
    $('#pingBadge').className = ok ? 'badge selesai' : 'badge ditolak';
    $('#pingBadge').innerHTML = `<span class="badge-dot"></span> ${ok ? 'Tersambung' : 'Gagal'}`;
    return ok;
  } catch {
    $('#pingBadge').className = 'badge ditolak';
    $('#pingBadge').innerHTML = `<span class="badge-dot"></span> Offline`;
    return false;
  }
}

$('#btnTestApi').onclick = async () => { if (await ping()) loadData(); };

$('#loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const res = await api('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: fd.get('email'), password: fd.get('password') })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Login gagal');
    state.token = data.token;
    state.user = data.user;
    localStorage.setItem('eco_token', data.token);
    localStorage.setItem('eco_user', JSON.stringify(data.user));
    $('#roleTag').textContent = data.user.is_admin ? 'Admin' : 'Warga';
    $('#roleTag').className = 'badge selesai';
    loadData();
  } catch (err) { alert(err.message); }
};

async function loadData() {
  await ping();
  if (!state.token) { render(); return; }
  try {
    const [repRes, statsRes] = await Promise.all([
      api('/api/reports?limit=100'),
      api('/api/reports/stats')
    ]);
    if (repRes.ok) state.reports = await repRes.json();
    if (statsRes.ok) state.stats = await statsRes.json();
  } catch (_) {}
  render();
}

function setView(v) {
  state.view = v;
  $$('[data-nav]').forEach(el => el.classList.toggle('active', el.dataset.nav === v));
  render();
}

$$('[data-nav]').forEach(el => el.onclick = () => setView(el.dataset.nav));

function render() {
  const container = $('#screenBody');
  if (state.view === 'home') {
    const s = state.stats || { total: 0, diproses: 0, selesai: 0 };
    container.innerHTML = `
      <div style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px">
        <div style="font-size:11px;font-weight:700;color:var(--ink-muted)">TOTAL ISU LINGKUNGAN</div>
        <div style="font-size:32px;font-weight:800;margin:4px 0">${s.total}</div>
        <div style="font-size:12px;color:var(--sage);font-weight:600">✓ ${s.selesai} selesai dituntaskan</div>
      </div>
      ${state.reports.slice(0, 3).map(r => `
        <div class="feed-card" data-report-id="${r.id}">
          <span class="badge ${r.status}">${r.status}</span>
          <div style="font-weight:700;font-size:14px;margin-top:6px">${r.judul}</div>
          <div style="font-size:12px;color:var(--ink-muted);margin-top:4px">📍 ${r.lokasi_text || 'Lokasi terlampir'} • 👍 ${r.vote_count ?? 0}</div>
        </div>
      `).join('') || '<div style="text-align:center;padding:24px;color:var(--ink-muted)">Belum ada laporan.</div>'}
    `;
  } else if (state.view === 'map') {
    container.innerHTML = `<div id="mapViewBox" class="map-view"></div>`;
    setTimeout(() => {
      const el = $('#mapViewBox');
      if (!el) return;
      const map = L.map(el).setView([-6.2088, 106.8456], 12);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
      state.reports.filter(r => r.lat && r.lng).forEach(r => {
        L.circleMarker([r.lat, r.lng], { radius: 8, color: '#fff', weight: 2, fillColor: '#10B981', fillOpacity: 1 }).addTo(map);
      });
    }, 40);
  } else if (state.view === 'create') {
    container.innerHTML = `
      <form id="createReportForm" style="display:grid;gap:10px">
        <input class="lux-input" name="judul" placeholder="Judul Masalah" required minlength="5">
        <select class="lux-input" name="kategori">
          <option value="sampah">Sampah</option>
          <option value="pencemaran">Pencemaran</option>
          <option value="infrastruktur">Infrastruktur</option>
        </select>
        <textarea class="lux-input" name="deskripsi" placeholder="Deskripsi..." rows="3" required minlength="10"></textarea>
        <input class="lux-input" name="lokasi_text" placeholder="Lokasi...">
        <input class="lux-input" name="lat" id="latIn" value="-6.2088">
        <input class="lux-input" name="lng" id="lngIn" value="106.8456">
        <button class="btn-lux" type="submit">Kirim Laporan</button>
      </form>
    `;
    $('#createReportForm').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      await api('/api/reports', { method: 'POST', body: fd });
      loadData();
      setView('reports');
    };
  } else if (state.view === 'reports') {
    container.innerHTML = state.reports.map(r => `
      <div class="feed-card" data-report-id="${r.id}">
        <span class="badge ${r.status}">${r.status}</span>
        <div style="font-weight:700;font-size:14px;margin-top:6px">${r.judul}</div>
        <div style="font-size:12px;color:var(--ink-muted);margin-top:4px">${r.deskripsi}</div>
      </div>
    `).join('') || '<div style="text-align:center;padding:24px;color:var(--ink-muted)">Belum ada laporan.</div>';
  }

  $$('[data-report-id]').forEach(el => {
    el.onclick = () => openDetail(+el.dataset.reportId);
  });
}

async function openDetail(id) {
  const res = await api('/api/reports/' + id);
  const d = await res.json();
  $('#viewHeading').textContent = 'Detail #' + id;
  $('#screenBody').innerHTML = `
    <div class="feed-card">
      <span class="badge ${d.status}">${d.status}</span>
      <div style="font-size:16px;font-weight:800;margin:8px 0 4px">${d.judul}</div>
      <div style="font-size:13px;color:var(--ink-sub)">${d.deskripsi}</div>
      <button class="btn-lux" id="btnVoteDetail" style="margin-top:14px">Dukung (${d.vote_count ?? 0}) 👍</button>
    </div>
  `;
  $('#btnVoteDetail').onclick = async () => {
    await api('/api/reports/' + id + '/vote', { method: 'POST' });
    openDetail(id);
  };
}

ping();
loadData();
setView('home');
</script>
</body>
</html>
